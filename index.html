<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3GPP Protocol Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#e2e8f0;font-family:'Consolas','Monaco','Courier New',monospace;font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#111827}
::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#4b5563}

/* Header */
#header{background:#111827;border-bottom:1px solid #1f2937;padding:8px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#header h1{font-size:14px;font-weight:700;color:#06b6d4;letter-spacing:1px;white-space:nowrap}
.tab-group{display:flex;gap:3px}
.tab-btn{padding:4px 10px;border:1px solid #374151;background:#1a2035;color:#9ca3af;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;transition:all 0.2s}
.tab-btn:hover{background:#1f2937;color:#e2e8f0}
.tab-btn.active{color:#fff;border-color:transparent}
.tab-gen-2g.active{background:#d97706}
.tab-gen-3g.active{background:#16a34a}
.tab-gen-4g.active{background:#2563eb}
.tab-gen-5g.active{background:#7c3aed}
.tab-gen-all.active{background:#374151}
.tab-cert-ptcrb.active{background:#0e7490}
.tab-cert-gcf.active{background:#065f46}
.tab-cert-gsma.active{background:#7c2d12}
.tab-cert-all.active{background:#374151}
.sep{width:1px;background:#1f2937;height:20px}

/* Main layout */
#main{display:flex;flex:1;overflow:hidden}

/* Left panel */
#left-panel{width:240px;min-width:240px;background:#111827;border-right:1px solid #1f2937;display:flex;flex-direction:column;overflow:hidden}
#tc-search{padding:8px;border-bottom:1px solid #1f2937}
#tc-search input{width:100%;background:#1a2035;border:1px solid #374151;color:#e2e8f0;padding:5px 8px;border-radius:4px;font-family:inherit;font-size:11px;outline:none}
#tc-search input:focus{border-color:#3b82f6}
#tc-list{overflow-y:auto;flex:1}
.tc-item{padding:7px 10px;cursor:pointer;border-bottom:1px solid #0f172a;transition:background 0.15s}
.tc-item:hover{background:#1a2035}
.tc-item.active{background:#1e3a5f;border-left:3px solid #3b82f6}
.tc-item-id{font-size:10px;font-weight:700}
.tc-item-name{font-size:10px;color:#9ca3af;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-item-badges{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.badge{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:0.5px}
.badge-2g{background:#92400e;color:#fcd34d}
.badge-3g{background:#14532d;color:#86efac}
.badge-4g{background:#1e3a8a;color:#93c5fd}
.badge-5g{background:#4c1d95;color:#c4b5fd}
.badge-ptcrb{background:#164e63;color:#67e8f9}
.badge-gcf{background:#064e3b;color:#6ee7b7}
.badge-gsma{background:#7f1d1d;color:#fca5a5}

/* Center panel */
#center-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tc-info{background:#111827;border-bottom:1px solid #1f2937;padding:10px 14px}
#tc-info-title{font-size:13px;font-weight:700;color:#f1f5f9}
#tc-info-spec{font-size:10px;color:#64748b;margin-top:2px}
#tc-info-desc{font-size:11px;color:#94a3b8;margin-top:4px}
#controls{background:#0f172a;border-bottom:1px solid #1f2937;padding:8px 14px;display:flex;align-items:center;gap:8px}
.ctrl-btn{padding:5px 14px;border:none;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;transition:all 0.2s}
.btn-run{background:#16a34a;color:#fff}
.btn-run:hover{background:#15803d}
.btn-run.running{background:#dc2626}
.btn-step{background:#1d4ed8;color:#fff}
.btn-step:hover{background:#1e40af}
.btn-reset{background:#374151;color:#e2e8f0}
.btn-reset:hover{background:#4b5563}
.speed-label{color:#6b7280;font-size:10px;margin-left:8px}
.speed-select{background:#1a2035;border:1px solid #374151;color:#e2e8f0;padding:3px 6px;border-radius:4px;font-family:inherit;font-size:10px}
#step-counter{color:#64748b;font-size:10px;margin-left:auto}

/* Sequence diagram */
#diagram-container{flex:1;overflow:auto;background:#0a0e1a;position:relative}
#seq-svg{display:block}

/* IE Inspector */
#ie-inspector{background:#111827;border-top:1px solid #1f2937;max-height:220px;overflow:hidden;transition:max-height 0.3s}
#ie-inspector.collapsed{max-height:28px}
#ie-inspector-header{padding:5px 10px;background:#0f172a;border-bottom:1px solid #1f2937;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#06b6d4}
#ie-inspector-body{overflow-y:auto;max-height:188px;padding:6px 10px}
.ie-node{margin-left:0}
.ie-node .ie-node{margin-left:16px}
.ie-row{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:3px;cursor:pointer;transition:background 0.1s}
.ie-row:hover{background:#1a2035}
.ie-toggle{width:12px;color:#6b7280;font-size:9px;transition:transform 0.2s;display:inline-block}
.ie-node[data-expanded="true"] > .ie-row > .ie-toggle{transform:rotate(90deg)}
.ie-name{color:#93c5fd;font-size:10px;min-width:160px}
.ie-type{color:#6b7280;font-size:9px;min-width:80px}
.ie-value{color:#fcd34d;font-size:10px;min-width:120px}
.ie-mand{color:#ef4444;font-size:10px;width:10px}
.ie-ref{color:#4b5563;font-size:9px}
.ie-children{display:none}
.ie-node[data-expanded="true"] > .ie-children{display:block}
#ie-step-label{color:#64748b;font-size:10px;margin-left:auto}

/* Right panel */
#right-panel{width:260px;min-width:260px;background:#111827;border-left:1px solid #1f2937;display:flex;flex-direction:column;overflow:hidden}
.right-section{border-bottom:1px solid #1f2937;padding:8px 10px;flex-shrink:0}
.right-section-title{font-size:10px;font-weight:700;color:#64748b;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}

/* UE State */
#ue-state-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.state-item{background:#1a2035;border-radius:4px;padding:5px 7px}
.state-label{font-size:9px;color:#64748b;margin-bottom:2px}
.state-value{font-size:10px;font-weight:700;color:#f1f5f9}
.state-idle{color:#6b7280}
.state-active{color:#22d3ee}
.state-connected{color:#4ade80}
.state-registered{color:#a78bfa}

/* Timers */
#timer-list{display:flex;flex-direction:column;gap:2px;max-height:130px;overflow-y:auto}
.timer-item{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:3px;background:#1a2035}
.timer-name{font-size:10px;color:#93c5fd;min-width:50px}
.timer-status{font-size:9px;color:#6b7280}
.timer-running .timer-name{color:#4ade80}
.timer-running .timer-status{color:#fcd34d}
.timer-elapsed{font-size:9px;color:#f59e0b;margin-left:auto;font-variant-numeric:tabular-nums}

/* Log */
#log-area{flex:1;overflow-y:auto;padding:6px 8px;background:#0a0e1a;font-size:10px;line-height:1.6}
.log-line{padding:1px 0;border-bottom:1px solid #0f172a}
.log-ts{color:#374151;margin-right:4px}
.log-info{color:#22d3ee}
.log-tx{color:#4ade80}
.log-rx{color:#60a5fa}
.log-warn{color:#fbbf24}
.log-err{color:#f87171}
.log-int{color:#a78bfa}

/* Bottom protocol stack */
#bottom-stack{background:#0d1117;border-top:1px solid #1f2937;padding:6px 12px;display:flex;align-items:center;gap:2px;flex-shrink:0;overflow-x:auto}
.stack-label{font-size:9px;color:#4b5563;margin-right:4px;white-space:nowrap}
.stack-layer{padding:3px 8px;border-radius:3px;font-size:10px;font-weight:700;cursor:pointer;transition:all 0.3s;opacity:0.5;white-space:nowrap}
.stack-layer.active-layer{opacity:1;box-shadow:0 0 8px currentColor}
.stack-layer.highlight{opacity:1;transform:scaleY(1.2);box-shadow:0 0 12px currentColor}

/* Responsive arrows */
.arrow-internal{stroke-dasharray:4,2}

/* Tooltip */
.tooltip{position:absolute;background:#1f2937;border:1px solid #374151;border-radius:4px;padding:4px 8px;font-size:10px;color:#e2e8f0;pointer-events:none;z-index:100;max-width:200px;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<!-- HEADER -->
<div id="header">
  <h1>3GPP Protocol Simulator</h1>
  <div class="tab-group" id="gen-tabs">
    <button class="tab-btn tab-gen-2g" onclick="setGenFilter('2G')">2G</button>
    <button class="tab-btn tab-gen-3g" onclick="setGenFilter('3G')">3G</button>
    <button class="tab-btn tab-gen-4g" onclick="setGenFilter('4G')">4G</button>
    <button class="tab-btn tab-gen-5g" onclick="setGenFilter('5G')">5G</button>
    <button class="tab-btn tab-gen-all active" onclick="setGenFilter('ALL')">ALL</button>
  </div>
  <div class="sep"></div>
  <div class="tab-group" id="cert-tabs">
    <button class="tab-btn tab-cert-ptcrb" onclick="setCertFilter('PTCRB')">PTCRB</button>
    <button class="tab-btn tab-cert-gcf" onclick="setCertFilter('GCF')">GCF</button>
    <button class="tab-btn tab-cert-gsma" onclick="setCertFilter('GSMA')">GSMA</button>
    <button class="tab-btn tab-cert-all active" onclick="setCertFilter('ALL')">ALL</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <!-- LEFT PANEL -->
  <div id="left-panel">
    <div id="tc-search"><input type="text" placeholder="Search test cases..." id="search-input" oninput="filterTCs()"></div>
    <div id="tc-list"></div>
  </div>

  <!-- CENTER PANEL -->
  <div id="center-panel">
    <div id="tc-info">
      <div id="tc-info-title">Select a Test Case</div>
      <div id="tc-info-spec"></div>
      <div id="tc-info-desc">Choose a test case from the left panel to begin simulation</div>
    </div>
    <div id="controls">
      <button class="ctrl-btn btn-run" id="btn-run" onclick="toggleRun()">&#9654; Run</button>
      <button class="ctrl-btn btn-step" id="btn-step" onclick="stepForward()">Step &#8250;</button>
      <button class="ctrl-btn btn-reset" onclick="resetSim()">&#8635; Reset</button>
      <span class="speed-label">Speed:</span>
      <select class="speed-select" id="speed-select">
        <option value="1500">Slow</option>
        <option value="800" selected>Normal</option>
        <option value="400">Fast</option>
        <option value="150">Turbo</option>
      </select>
      <span id="step-counter"></span>
    </div>
    <div id="diagram-container">
      <svg id="seq-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <div id="ie-inspector" class="collapsed">
      <div id="ie-inspector-header" onclick="toggleIEInspector()">
        <span id="ie-toggle-arrow">▶</span>
        <span>IE Inspector</span>
        <span id="ie-step-label" style="color:#4b5563;font-size:10px;margin-left:8px"></span>
      </div>
      <div id="ie-inspector-body"></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <div class="right-section">
      <div class="right-section-title">UE State Machine</div>
      <div id="ue-state-grid">
        <div class="state-item"><div class="state-label">RRC</div><div class="state-value state-idle" id="s-rrc">RRC_IDLE</div></div>
        <div class="state-item"><div class="state-label">EMM</div><div class="state-value state-idle" id="s-emm">EMM-DEREGISTERED</div></div>
        <div class="state-item"><div class="state-label">ECM</div><div class="state-value state-idle" id="s-ecm">ECM-IDLE</div></div>
        <div class="state-item"><div class="state-label">5GMM</div><div class="state-value state-idle" id="s-5gmm">5GMM-DEREGISTERED</div></div>
        <div class="state-item"><div class="state-label">MM (2G/3G)</div><div class="state-value state-idle" id="s-mm">MM-IDLE</div></div>
        <div class="state-item"><div class="state-label">GMM</div><div class="state-value state-idle" id="s-gmm">GMM-DEREGISTERED</div></div>
      </div>
    </div>
    <div class="right-section">
      <div class="right-section-title">Active Timers</div>
      <div id="timer-list"></div>
    </div>
    <div class="right-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0">
      <div class="right-section-title" style="flex-shrink:0">Modem Log</div>
      <div id="log-area"></div>
    </div>
  </div>
</div>

<!-- BOTTOM PROTOCOL STACK -->
<div id="bottom-stack">
  <span class="stack-label">Stack:</span>
  <div id="stack-layers"></div>
</div>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const LAYER_COLORS = {
  PHY:'#f97316',MAC:'#f59e0b',RLC:'#10b981',PDCP:'#3b82f6',
  SDAP:'#8b5cf6',RRC:'#06b6d4',RR:'#14b8a6',NAS:'#ef4444',
  EMM:'#ef4444',ESM:'#f87171',MM:'#f43f5e',CC:'#fb7185',
  GMM:'#fb923c',SM:'#fb923c',IMS:'#ec4899',APP:'#6366f1',

  T3410:'15s',T3411:'10s',T3412:'54min',
  T3416:'32s',T3421:'15s',T3430:'15s',T3440:'8s',

  T3324:'0s (default)',T3346:'PLMN specific',
  T3402:'12min',T3412:'54min',T3423:'6min'

const STACK_LAYERS = {
  '2G':['PHY','LAPDm','RR','MM','CC','GMM','SM'],
  '3G':['PHY','MAC','RLC','RRC','MM','CM','GMM','SM'],
  '4G':['PHY','MAC','RLC','PDCP','RRC','NAS-EMM','NAS-ESM'],
  '5G':['PHY','MAC','RLC','PDCP','SDAP','RRC','NAS-5GMM','NAS-5GSM'],
  'NSA':['PHY','MAC','RLC','PDCP','SDAP','RRC','NAS-EMM','NAS-ESM']
};

const GEN_COLORS = {
  '2G':'#d97706','3G':'#16a34a','4G':'#2563eb','5G':'#7c3aed','GSMA':'#b91c1c'

// TEST CASE DATA

const TC_DATA = [

// STATE

let currentTC = null;
let currentStep = -1;
let isRunning = false;
let runTimer = null;
let activeTimers = {};
let timerIntervals = {};
let genFilter = 'ALL';
let certFilter = 'ALL';
let ieInspectorOpen = false;
let ueState = {};

function resetUEState(){
  ueState={rrc:'RRC_IDLE',emm:'EMM-DEREGISTERED',ecm:'ECM-IDLE',
    fivegmm:'5GMM-DEREGISTERED',mm:'MM-IDLE',gmm:'GMM-DEREGISTERED',cc:'CC-IDLE'};
  updateStateDisplay();
}

function updateStateDisplay(){
  const map={rrc:'s-rrc',emm:'s-emm',ecm:'s-ecm',fivegmm:'s-5gmm',mm:'s-mm',gmm:'s-gmm'};
  for(const [k,id] of Object.entries(map)){
    const el=document.getElementById(id);
    if(!el)continue;
    el.textContent=ueState[k]||'—';
    el.className='state-value';
    const v=(ueState[k]||'').toLowerCase();
    if(v.includes('idle')||v.includes('deregistered'))el.classList.add('state-idle');
    else if(v.includes('connected')||v.includes('active'))el.classList.add('state-connected');
    else if(v.includes('registered')&&!v.includes('init'))el.classList.add('state-registered');
    else el.classList.add('state-active');
  }
}

// ============================================================
// TIMERS
// ============================================================
function startTimer(name){
  if(timerIntervals[name])clearInterval(timerIntervals[name]);
  const start=Date.now();
  activeTimers[name]={start,elapsed:0,running:true};
  timerIntervals[name]=setInterval(()=>{
    if(activeTimers[name]){
      activeTimers[name].elapsed=Math.floor((Date.now()-start)/100)/10;
      renderTimers();
    }
  },100);
  renderTimers();
}

function stopTimer(name){
  if(timerIntervals[name]){clearInterval(timerIntervals[name]);delete timerIntervals[name];}
  if(activeTimers[name]){delete activeTimers[name];}
  renderTimers();
}

function clearAllTimers(){
  for(const t of Object.keys(timerIntervals))clearInterval(timerIntervals[t]);
  timerIntervals={};activeTimers={};
  renderTimers();
}

function renderTimers(){
  const el=document.getElementById('timer-list');
  if(!el)return;
  if(Object.keys(activeTimers).length===0){
    el.innerHTML='<div style="color:#374151;font-size:10px;padding:4px">No active timers</div>';return;
  }
  el.innerHTML=Object.entries(activeTimers).map(([name,t])=>{
    const dur=TIMER_DURATIONS[name]||'—';
    return `<div class="timer-item timer-running">
      <span class="timer-name">${name}</span>
      <span class="timer-status">${dur}</span>
      <span class="timer-elapsed">${t.elapsed.toFixed(1)}s</span>
    </div>`;
  }).join('');
}

// ============================================================
// LOG
// ============================================================
let logLines=[];
function addLog(msg,type='info'){
  const ts=new Date().toTimeString().split(' ')[0];
  logLines.push({ts,msg,type});
  if(logLines.length>200)logLines.shift();
  const el=document.getElementById('log-area');
  if(!el)return;
  const cls={'info':'log-info','tx':'log-tx','rx':'log-rx','warn':'log-warn','err':'log-err','int':'log-int'}[type]||'log-info';
  const div=document.createElement('div');
  div.className='log-line';
  div.innerHTML=`<span class="log-ts">[${ts}]</span><span class="${cls}">${msg}</span>`;
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}

function clearLog(){
  logLines=[];
  const el=document.getElementById('log-area');
  if(el)el.innerHTML='';
}

function setGenFilter(g){
  genFilter=g;
  document.querySelectorAll('#gen-tabs .tab-btn').forEach(b=>{
    b.classList.toggle('active',b.textContent.trim()===g||(g==='ALL'&&b.textContent.trim()==='ALL'));
  });
  renderTCList();
}

function setCertFilter(c){
  certFilter=c;
  document.querySelectorAll('#cert-tabs .tab-btn').forEach(b=>{
    b.classList.toggle('active',b.textContent.trim()===c||(c==='ALL'&&b.textContent.trim()==='ALL'));
  });
  renderTCList();
}

function filterTCs(){renderTCList();}

function renderTCList(){
  const search=(document.getElementById('search-input')||{}).value||'';
  const sl=search.toLowerCase();
  const filtered=TC_DATA.filter(tc=>{
    const gOk=genFilter==='ALL'||tc.gen===genFilter;
    const cOk=certFilter==='ALL'||tc.cert===certFilter;
    const sOk=!sl||tc.id.toLowerCase().includes(sl)||tc.name.toLowerCase().includes(sl)||tc.spec.toLowerCase().includes(sl);
    return gOk&&cOk&&sOk;
  });
  const el=document.getElementById('tc-list');
  if(!el)return;
  el.innerHTML=filtered.map(tc=>{
    const gc=GEN_COLORS[tc.gen]||'#64748b';
    const certBadge=`badge-${tc.cert.toLowerCase()}`;
    const genBadge=`badge-${tc.gen.toLowerCase()}`;
    return `<div class="tc-item${currentTC&&currentTC.id===tc.id?' active':''}" onclick="selectTC('${tc.id}')">
      <div class="tc-item-id" style="color:${gc}">${tc.id}</div>
      <div class="tc-item-name">${tc.name}</div>
      <div class="tc-item-badges">
        <span class="badge ${genBadge}">${tc.gen}</span>
        <span class="badge ${certBadge}">${tc.cert}</span>
      </div>
    </div>`;
  }).join('');
  if(filtered.length===0){
    el.innerHTML='<div style="color:#4b5563;padding:12px;font-size:11px">No test cases match filter</div>';
  }
}

// ============================================================
function selectTC(id){
  const tc=TC_DATA.find(t=>t.id===id);
  if(!tc)return;
  if(isRunning)stopRun();
  currentTC=tc;
  currentStep=-1;
  resetUEState();
  clearAllTimers();
  clearLog();
  document.getElementById('tc-info-title').textContent=`${tc.id}: ${tc.name}`;
  document.getElementById('tc-info-spec').textContent=`Spec: ${tc.spec}  |  Gen: ${tc.gen}  |  Cert: ${tc.cert}`;
  document.getElementById('tc-info-desc').textContent=tc.desc;
  document.getElementById('step-counter').textContent=`Step: 0/${tc.steps.length}`;
  renderTCList();
  renderStack(tc.stack);
  renderDiagram();
  renderIEInspector(null);
  addLog(`=== ${tc.id}: ${tc.name} loaded ===`,'info');
  addLog(`Spec: ${tc.spec}`,'info');
}

// ============================================================
function renderStack(stackKey){
  const layers=STACK_LAYERS[stackKey]||STACK_LAYERS['4G'];
  const el=document.getElementById('stack-layers');
  if(!el)return;
  el.innerHTML=layers.map(l=>{
    const color=LAYER_COLORS[l]||LAYER_COLORS[l.replace('NAS-','')]||'#64748b';
    return `<span class="stack-layer" id="sl-${l.replace(/[^a-zA-Z0-9]/g,'_')}" style="background:${color}22;color:${color};border:1px solid ${color}44">${l}</span>`;
  }).join('');
}

function highlightLayer(layerName){
  document.querySelectorAll('.stack-layer').forEach(el=>el.classList.remove('highlight'));
  const key=layerName.replace(/[^a-zA-Z0-9]/g,'_');
  const layerEl=document.getElementById(`sl-${key}`);
  if(layerEl){layerEl.classList.add('highlight');}else{
    // try partial match
    document.querySelectorAll('.stack-layer').forEach(el=>{
      if(el.textContent.includes(layerName)||layerName.includes(el.textContent)){
        el.classList.add('highlight');
      }
    });
  }
}
// ============================================================
// SVG SEQUENCE DIAGRAM
// ============================================================
function renderDiagram(){
  if(!currentTC){
    const svg=document.getElementById('seq-svg');
    svg.setAttribute('width','750');svg.setAttribute('height','200');
    svg.innerHTML='<text x="375" y="100" text-anchor="middle" fill="#374151" font-size="13" font-family="Consolas,Monaco,monospace">Select a test case to begin</text>';
    return;
  }
  const tc=currentTC;
  const entities=tc.entities;
  const steps=tc.steps;
  const W=750,MARGIN=70,ENT_H=30,ENT_W=110;
  const N=entities.length;
  const spacing=N>1?(W-2*MARGIN)/(N-1):0;
  const entX=entities.map((_,i)=>N===1?W/2:MARGIN+i*spacing);
  const svgH=80+steps.length*58+60;

  let html='';

  // Entity boxes
  entities.forEach((e,i)=>{
    const x=entX[i],gc=GEN_COLORS[tc.gen]||'#64748b';
    html+=`<rect x="${x-ENT_W/2}" y="10" width="${ENT_W}" height="${ENT_H}" rx="4" fill="#1a2035" stroke="${gc}" stroke-width="1.5"/>`;
    html+=`<text x="${x}" y="29" text-anchor="middle" fill="${gc}" font-size="10" font-weight="700" font-family="Consolas,Monaco,monospace">${e}</text>`;
    // lifeline
    html+=`<line x1="${x}" y1="40" x2="${x}" y2="${svgH-20}" stroke="#1f2937" stroke-width="1" stroke-dasharray="4,3"/>`;
  });

  // Steps
  steps.forEach((step,idx)=>{
    const y=80+idx*58;
    const midY=y+29;
    const isActive=idx===currentStep;
    const isDone=idx<currentStep;
    const bgColor=isActive?'rgba(59,130,246,0.15)':isDone?'rgba(16,185,129,0.06)':'transparent';
    
    // Row highlight
    if(bgColor!=='transparent')
      html+=`<rect x="0" y="${y}" width="${W}" height="58" fill="${bgColor}" rx="0"/>`;
    
    // Step number
    html+=`<text x="8" y="${midY+4}" fill="${isActive?'#60a5fa':isDone?'#4ade80':'#374151'}" font-size="10" font-family="Consolas,Monaco,monospace">${idx+1}</text>`;

    const layerKey=step.layer;
    const color=LAYER_COLORS[layerKey]||'#64748b';
    const fi=step.from,ti=step.to;
    const fx=entX[fi]||MARGIN,tx=entX[ti]||MARGIN;

    if(fi===ti){
      // Self-loop
      const rx=fx+30,ry1=midY-12,ry2=midY+12;
      html+=`<path d="M${fx},${ry1} Q${rx+25},${ry1} ${rx+25},${midY} Q${rx+25},${ry2} ${fx},${ry2}" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="4,2"/>`;
      html+=`<polygon points="${fx},${ry2-4} ${fx-5},${ry2+3} ${fx+5},${ry2+3}" fill="${color}"/>`;
      html+=`<text x="${fx+18}" y="${midY-2}" fill="${color}" font-size="10" font-family="Consolas,Monaco,monospace" font-weight="600">${step.msg}</text>`;
    }else{
      const dir=tx>fx?1:-1;
      const arrowX=tx+dir*(-12);
      // Arrow line
      html+=`<line x1="${fx}" y1="${midY}" x2="${arrowX}" y2="${midY}" stroke="${color}" stroke-width="${isActive?2:1.5}"/>`;
      // Arrowhead
      const px=tx+(dir>0?-8:8);
      html+=`<polygon points="${tx},${midY} ${px},${midY-5} ${px},${midY+5}" fill="${color}"/>`;
      // Label above arrow
      const lx=(fx+tx)/2,ly=midY-8;
      const lw=Math.abs(tx-fx)-20;
      html+=`<text x="${lx}" y="${ly}" text-anchor="middle" fill="${color}" font-size="10" font-family="Consolas,Monaco,monospace" font-weight="600"`;
      if(lw>0)html+=` textLength="${Math.min(lw,200)}" lengthAdjust="spacingAndGlyphs"`;
      html+=`>${step.msg}</text>`;
      // Direction indicator for UL/DL
      if(step.dir==='ul'){
        html+=`<text x="${lx+2}" y="${midY+14}" text-anchor="middle" fill="${color}88" font-size="8" font-family="Consolas,Monaco">UL</text>`;
      }else if(step.dir==='dl'){
        html+=`<text x="${lx+2}" y="${midY+14}" text-anchor="middle" fill="${color}88" font-size="8" font-family="Consolas,Monaco">DL</text>`;
      }
    }

    // Layer badge at right
    html+=`<rect x="680" y="${midY-10}" width="56" height="18" rx="9" fill="${color}33" stroke="${color}66" stroke-width="1"/>`;
    html+=`<text x="708" y="${midY+3}" text-anchor="middle" fill="${color}" font-size="9" font-family="Consolas,Monaco,monospace" font-weight="700">${layerKey}</text>`;

    // Timer badge if applicable
    if(step.timer){
      const starts=(step.timer.start||[]).concat((step.timer2||{}).start||[]);
      const stops=(step.timer.stop||[]).concat((step.timer2||{}).stop||[]);
      let timerStr='';
      if(starts.length)timerStr+=`▶${starts.join(',')}`;
      if(stops.length)timerStr+=` ■${stops.join(',')}`;
      if(timerStr)
        html+=`<text x="640" y="${midY-12}" text-anchor="end" fill="#f59e0b" font-size="8" font-family="Consolas,Monaco">${timerStr}</text>`;
    }

    // IE marker if step has IEs
    if(step.ies){
      html+=`<circle cx="22" cy="${midY}" r="5" fill="${isActive?'#3b82f6':'#1e3a5f'}" stroke="#3b82f6" stroke-width="1" style="cursor:pointer" onclick="clickStep(${idx})" data-step="${idx}"/>`;
      html+=`<text x="22" y="${midY+3}" text-anchor="middle" fill="${isActive?'#fff':'#60a5fa'}" font-size="7" style="cursor:pointer" onclick="clickStep(${idx})" font-family="Consolas,Monaco">IE</text>`;
    }

    // Clickable overlay
    html+=`<rect x="0" y="${y}" width="${W}" height="58" fill="transparent" style="cursor:pointer" onclick="clickStep(${idx})"/>`;
  });

  // Bottom entity boxes (repeat)
  entities.forEach((e,i)=>{
    const x=entX[i],gc=GEN_COLORS[tc.gen]||'#64748b';
    html+=`<rect x="${x-ENT_W/2}" y="${svgH-40}" width="${ENT_W}" height="${ENT_H}" rx="4" fill="#1a2035" stroke="${gc}" stroke-width="1.5"/>`;
    html+=`<text x="${x}" y="${svgH-21}" text-anchor="middle" fill="${gc}" font-size="10" font-weight="700" font-family="Consolas,Monaco,monospace">${e}</text>`;
  });

  const svg=document.getElementById('seq-svg');
  svg.setAttribute('width',W);
  svg.setAttribute('height',svgH);
  svg.innerHTML=html;
}

function clickStep(idx){
  if(!currentTC)return;
  if(idx<=currentStep){
    // Show IE for clicked step
    renderIEInspector(currentTC.steps[idx]);
  }
}
// ============================================================
// IE INSPECTOR
// ============================================================
function toggleIEInspector(){
  ieInspectorOpen=!ieInspectorOpen;
  const el=document.getElementById('ie-inspector');
  const arrow=document.getElementById('ie-toggle-arrow');
  if(ieInspectorOpen){el.classList.remove('collapsed');arrow.textContent='▼';}
  else{el.classList.add('collapsed');arrow.textContent='▶';}
}

function toggleIENode(row){
  const node=row.parentElement;
  const exp=node.getAttribute('data-expanded')==='true';
  node.setAttribute('data-expanded',exp?'false':'true');
}

function renderIEInspector(step){
  const labelEl=document.getElementById('ie-step-label');
  const bodyEl=document.getElementById('ie-inspector-body');
  if(!step||!step.ies){
    if(labelEl)labelEl.textContent='';
    if(bodyEl)bodyEl.innerHTML='<div style="color:#4b5563;font-size:10px;padding:6px">No IE detail for this step. Click a step with [IE] marker.</div>';
    return;
  }
  if(labelEl)labelEl.textContent=`Step: ${step.msg}`;
  if(!ieInspectorOpen)toggleIEInspector();
  if(bodyEl)bodyEl.innerHTML=step.ies.map(ie=>renderIENode(ie)).join('');
}

function renderIENode(ie,depth=0){
  const hasChildren=ie.children&&ie.children.length>0;
  return `<div class="ie-node" data-expanded="${depth===0?'true':'false'}">
    <div class="ie-row" onclick="toggleIENode(this)">
      <span class="ie-toggle">${hasChildren?'▶':' '}</span>
      <span class="ie-name">${ie.name}</span>
      <span class="ie-type">${ie.type||''}</span>
      <span class="ie-value">${ie.value||''}</span>
      <span class="ie-mand" title="${ie.mand?'Mandatory':'Optional'}">${ie.mand?'*':''}</span>
      <span class="ie-ref">${ie.ref||''}</span>
    </div>
    ${hasChildren?`<div class="ie-children">${ie.children.map(c=>renderIENode(c,depth+1)).join('')}</div>`:''}
  </div>`;
}

// ============================================================
// SIMULATION CONTROL
// ============================================================
function stepForward(){
  if(!currentTC)return;
  const nextStep=currentStep+1;
  if(nextStep>=currentTC.steps.length){
    addLog('=== Test case completed ===','info');
    document.getElementById('step-counter').textContent=`Step: DONE/${currentTC.steps.length}`;
    return;
  }
  executeStep(nextStep);
}

function executeStep(stepIdx){
  if(!currentTC||stepIdx>=currentTC.steps.length)return;
  const step=currentTC.steps[stepIdx];
  currentStep=stepIdx;

  // Update UE state
  if(step.ue_state_after){
    Object.assign(ueState,step.ue_state_after);
    updateStateDisplay();
  }

  // Handle timers
  const processTimers=(timerObj)=>{
    if(!timerObj)return;
    (timerObj.start||[]).forEach(t=>startTimer(t));
    (timerObj.stop||[]).forEach(t=>stopTimer(t));
  };
  processTimers(step.timer);
  processTimers(step.timer2);

  // Log
  const logType=step.dir==='ul'?'tx':step.dir==='dl'?'rx':'int';
  if(step.log)addLog(step.log,logType);
  if(step.ue_note)addLog(`  ↪ ${step.ue_note}`,'info');

  // Highlight layer
  if(step.layer)highlightLayer(step.layer);

  // Show IE inspector if step has IEs
  if(step.ies)renderIEInspector(step);

  // Update counter
  document.getElementById('step-counter').textContent=`Step: ${stepIdx+1}/${currentTC.steps.length}`;

  // Re-render diagram
  renderDiagram();

  // Scroll diagram to show current step
  const container=document.getElementById('diagram-container');
  if(container){
    const targetY=80+stepIdx*58;
    container.scrollTop=Math.max(0,targetY-100);
  }
}

function toggleRun(){
  if(isRunning){stopRun();}else{startRun();}
}

function startRun(){
  if(!currentTC){addLog('Select a test case first','warn');return;}
  isRunning=true;
  const btn=document.getElementById('btn-run');
  btn.textContent='⏹ Stop';btn.classList.add('running');
  scheduleNext();
}

function scheduleNext(){
  if(!isRunning)return;
  const nextStep=currentStep+1;
  if(nextStep>=currentTC.steps.length){
    stopRun();
    addLog('=== Test case completed successfully ===','info');
    document.getElementById('step-counter').textContent=`Step: DONE/${currentTC.steps.length}`;
    return;
  }
  const speed=parseInt(document.getElementById('speed-select').value)||800;
  runTimer=setTimeout(()=>{
    executeStep(nextStep);
    scheduleNext();
  },speed);
}

function stopRun(){
  isRunning=false;
  if(runTimer){clearTimeout(runTimer);runTimer=null;}
  const btn=document.getElementById('btn-run');
  btn.textContent='▶ Run';btn.classList.remove('running');
}

function resetSim(){
  stopRun();
  if(!currentTC)return;
  currentStep=-1;
  resetUEState();
  clearAllTimers();
  clearLog();
  renderDiagram();
  renderIEInspector(null);
  document.getElementById('step-counter').textContent=`Step: 0/${currentTC.steps.length}`;
  addLog(`=== ${currentTC.id} reset ===`,'info');
  document.querySelectorAll('.stack-layer').forEach(el=>el.classList.remove('highlight'));
}

// ============================================================
// INIT
// ============================================================
window.onload=function(){
  renderTCList();
  resetUEState();
  renderTimers();
  renderDiagram();
  renderStack('4G');
  addLog('3GPP Protocol Simulator ready. Select a test case.','info');
  addLog('Supports 2G/3G/4G/5G | PTCRB/GCF/GSMA | 55 test cases','info');
};
</script>
